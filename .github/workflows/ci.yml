name: CI

# Checks every branch except main (main is built and deployed by deploy.yml).
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Multiplayer server smoke test
        working-directory: server
        run: npm install --no-audit --no-fund && npm test
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
