name: Preview build (temporary)
on:
  push:
    branches: [mmorpg-style]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: Push dist to preview branch
        run: |
          cd dist
          git init -q -b mmorpg-preview-dist
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "preview build"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" mmorpg-preview-dist
